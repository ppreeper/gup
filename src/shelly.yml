name: gup
help: github app installer
version: 0.1.0

commands:
  - name: install
    help: install an application
    examples:
      - gup install neovim
    commands:
      # Commands
      - name: gup
        help: install gup command

      - name: update
        help: update script for apt update

      # Common setups
      - name: devsetup
        help: common dev tool setup

      # Language Development - Go
      - name: go
        help: go programming language
        group: Language Development - Go
      - name: tinygo
        help: tinygo is a Go compiler for small places
        group: Language Development - Go
      - name: gopls
        help: Go language server
        group: Language Development - Go
      - name: dlv
        help: Delve is a source level debugger for Go programs
        group: Language Development - Go

      - name: godev
        help: Go dev setup
        group: Language Development - Go


      # Language Development - JavaScript
      - name: nodejs
        help: node js engine
        group: Language Development - JS TS
      - name: nvm
        help: Node Version Manager
        group: Language Development - JS TS
      - name: tsc
        help: Typescript compiler
        group: Language Development - JS TS
      - name: jsdev
        help: JS TS dev setup
        group: Language Development - JS TS

      # Language Development - Lua
      - name: stylua
        help: extremely fast Lua formatter
        group: Language Development - Lua

      # Language Development - Python
      - name: uv
        help: extremely fast Python package installer and resolver
        group: Language Development - Python
      - name: ruff
        help: an extremely fast Python linter and code formatter
        group: Language Development - Python
      - name: pydev
        help: Python dev setup
        group: Language Development - Python

      # Language Development - Rust
      - name: rust
        help: rust programming language
        group: Language Development - Rust

      # Language Development - Zig
      - name: zig
        help: zig programming language
        group: Language Development - Zig
      - name: zls
        help: zig language server
        group: Language Development - Zig
      - name: zigdev
        help: zig language setup
        group: Language Development - Zig

      # Go Development Tools
      - name: go-blueprint
        help: Go-blueprint allows users to spin up a quick Go project using a popular framework
        group: Go Development Tools
      - name: gowebly
        help: CLI tool to create amazing web applications with Go
        group: Go Development Tools
      - name: goplay
        help: The Go Playground client
        group: Go Development Tools
      - name: gotests
        help: Generate Go tests from your source code
        group: Go Development Tools
      - name: impl
        help: impl generates method stubs for implementing an interface
        group: Go Development Tools
      - name: gomodifytags
        help: Go tool to modify/update field tags in structs
        group: Go Development Tools
      - name: air
        help: Live reload for Go apps
        group: Go Development Tools
      - name: gofumpt
        help: gofumpt is a stricter gofmt
        group: Go Development Tools
      - name: goimports
        help: Go tool to format Go source code and manage imports
        group: Go Development Tools
      - name: swag
        help: Automatically generate RESTful API documentation with Swagger 2.0 for Go
        group: Go Development Tools
      - name: templ
        help: An HTML templating language for Go that has great developer tooling
        group: Go Development Tools

      # Linter / Formatter / Code Quality
      - name: scc
        help: Sloc Cloc and Code (scc)
        group: Linter / Formatter / Code Quality
      - name: yamlfmt
        help: an extensible command line tool or library to format yaml files.
        group: Linter / Formatter / Code Quality
      - name: ruxx
        help: ruxx xml linter formatter
        group: Linter / Formatter / Code Quality
      - name: rusq
        help: rusq sql linter formatter
        group: Linter / Formatter / Code Quality

      # Language Servers & Debuggers
      # Editors & IDEs
      - name: neovim
        help: NeoVIM
        group: Editors & IDEs

      # Observability & Monitoring
      - name: btop
        help: btop
        group: Observability & Monitoring
      - name: gotop
        help: gotop terminal based graphical activity monitor
        group: Observability & Monitoring

      # Containers & Orchestration
      - name: lazydocker
        help: A simple terminal UI for docker and docker-compose
        group: Containers & Orchestration
      - name: kubectl
        help: kubectl
        group: Containers & Orchestration
      - name: k9s
        help: Kubernetes CLI
        group: Containers & Orchestration

      # Cloud / Hosting CLI Tools
      - name: b2
        help: Backblaze B2 cli tool
        group: Cloud / Hosting CLI Tools
      - name: githubcli
        help: github cli - gh
        group: Cloud / Hosting CLI Tools
      - name: forgejocli
        help: forgejo cli - fj
        group: Cloud / Hosting CLI Tools

      # Web / Frontend / Site / Proxies
      - name: xcaddy
        help: xcaddy builds custom Caddy binaries with plugins
        group: Web / Frontend / Site / Proxies
      - name: hugo
        help: hugo website generator
        group: Web / Frontend / Site / Proxies
      - name: tailwindcss
        help: tailwindcss cli
        group: Web / Frontend / Site / Proxies

      # Utilities & CLI Helpers
      - name: duf
        help: Disk Usage/Free Utility
        group: Utilities & CLI Helpers
      - name: gdu
        help: Fast disk usage analyzer with console interface written in Go
        group: Utilities & CLI Helpers
      - name: gum
        help: A tool for glamorous shell scripts
        group: Utilities & CLI Helpers
      - name: lazygit
        help: A simple terminal UI for git commands
        group: Utilities & CLI Helpers
      - name: muffet
        help: A fast, concurrent web link checker
        group: Utilities & CLI Helpers
      - name: s5cmd
        help: s5cmd is a super fast and highly parallel S3 and local filesystem execution
        group: Utilities & CLI Helpers
      - name: sshconfig
        help: A tool to manage SSH configuration
        group: Utilities & CLI Helpers
      - name: task
        help: A task runner / simpler Make alternative written in Go
        group: Utilities & CLI Helpers
      - name: timer
        help: A sleep command with a progress bar
        group: Utilities & CLI Helpers
      - name: ytdlp
        help: A command-line program to download videos from YouTube and other sites
        group: Utilities & CLI Helpers
      - name: marp
        help: Marp CLI is a Markdown presentation tool
        group: Utilities & CLI Helpers
      - name: present
        help: presentation tool
        group: Utilities & CLI Helpers

      # Infrastructure & DevOps
      - name: distrobuilder
        help: Distrobuilder is a tool to build Linux distributions and images
        group: Infrastructure & DevOps

      # Packaging / Binary Tools
      - name: upx
        help: Ultimate Packer for eXecutables
        group: Packaging / Binary Tools

      # Database & Code Generation
      - name: goose
        help: Database migration tool for Go
        group: Database Code Generation
      - name: sqlc
        help: Generate type-safe code from SQL
        group: Database Code Generation

      # Security & Vulnerability Scanning
      - name: mkcert
        help: mkcert is a simple tool for making locally-trusted development certificates
        group: Security & Vulnerability Scanning
      - name: gitleaks
        help: checks for accidental secrets leaks
        group: Security & Vulnerability Scanning
      - name: golangci-lint
        help: golangci-lint is a linters aggregator for Go
        group: Security & Vulnerability Scanning
      - name: nilaway
        help: nilaway is a tool to detect nil pointer dereferences in Go code
        group: Security & Vulnerability Scanning
      - name: govulncheck
        help: Go vulnerability checker
        group: Security & Vulnerability Scanning
      - name: staticcheck
        help: The advanced Go linter
        group: Security & Vulnerability Scanning
      - name: trivy
        help: Comprehensive and versatile security scanner
        group: Security & Vulnerability Scanning
      - name: sectools
        help: security tools
        group: Security & Vulnerability Scanning

      # Fonts & Assets
      - name: nerdfonts
        help: nerdfonts installer
        group: Fonts & Assets
        args:
          - name: font
            required: true
            repeatable: true
            allowed: [Ubuntu, UbuntuMono, Hack, FiraMono, Noto]
      # end
  - name: remove
    help: remove an application and settings
    examples:
      - gup remove neovim
    commands:
      - name: neovim
        help: NeoVIM
